[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psx-mcp-server"
dynamic = ["version"]
description = "Model Context Protocol server for the Pakistan Stock Exchange — live quotes, EOD history, indices, fundamentals, dividends, and announcements as LLM-callable tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Raza", email = "ahmedrazaamjad101@gmail.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "psx",
    "pakistan-stock-exchange",
    "kse100",
    "stocks",
    "finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/ahmedraza-96/psx-mcp-server"
Repository = "https://github.com/ahmedraza-96/psx-mcp-server"
Issues = "https://github.com/ahmedraza-96/psx-mcp-server/issues"
Changelog = "https://github.com/ahmedraza-96/psx-mcp-server/blob/main/CHANGELOG.md"

[project.scripts]
psx-mcp-server = "psx_mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "pytest-cov>=5",
]

[tool.hatch.version]
path = "src/psx_mcp_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/psx_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real PSX endpoints (skipped in CI; run manually)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
